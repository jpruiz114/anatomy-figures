<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>F-22 Raptor</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;

  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;

  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(1180px,100% - 32px);margin:64px auto 96px}

  --ff-part-ring: #00000014;
  --ff-part-hover: #0000000a;

.ff .iso-plate { padding: 52px 24px 64px; overflow: hidden; }
.ff-stage { position: relative; touch-action: pan-y; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; cursor: move; }
.ff-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }
.ff-stage > svg, .ff-stage > canvas { display: block; width: 100%; height: auto; }
.ff-plume { position: absolute; inset: 0; height: 100% !important; pointer-events: none; mix-blend-mode: var(--ff-blend); }
.ff-cavity { fill: var(--ff-cavity); stroke: none; }
.ff-intake { fill: var(--ff-intake); stroke: none; }
.ff-cut { stroke-width: 0.8px; }
.ff-glass .iso-shade[data-shade="0"] { fill: color-mix(in srgb, var(--anatomy-shade-0), var(--ff-glass) 18%); }
.ff-glass .iso-shade[data-shade="1"] { fill: color-mix(in srgb, var(--anatomy-shade-1), var(--ff-glass) 18%); }

.ff-glass .iso-shade[data-shade="3"] { fill: color-mix(in srgb, var(--anatomy-shade-3), var(--ff-glass) 18%); }
.ff-glass .iso-top { fill: color-mix(in srgb, var(--anatomy-top), var(--ff-glass) 24%); }
.ff-glass .iso-fill { fill: color-mix(in srgb, var(--anatomy-paper), var(--ff-glass) 18%); }
.ff-controls { position: absolute; left: 20px; bottom: 16px; display: flex; align-items: center; gap: 10px; font-family: var(--anatomy-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--anatomy-muted); }
.ff-throttle { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px 0 10px; border: 0; border-radius: 999px; background: var(--anatomy-face); color: var(--anatomy-muted); font: inherit; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; box-shadow: inset 0 0 0 1px var(--ff-button-ring); transition: background 200ms var(--anatomy-ease), color 200ms var(--anatomy-ease); }
.ff-throttle:hover { background: var(--ff-button-hover); }
.ff-throttle[data-on] { color: var(--anatomy-strong); }
.ff-throttle:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 3px; }
.ff-lamp { width: 7px; height: 7px; border-radius: 50%; background: var(--ff-lamp-off); transition: background 240ms var(--anatomy-ease), box-shadow 240ms var(--anatomy-ease); }
.ff-throttle[data-on] .ff-lamp { background: var(--ff-lamp-on); box-shadow: 0 0 10px 2px var(--ff-lamp-glow); }
.ff-hint { margin-left: 6px; }
.ff-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (max-width: 640px) {
  .ff .iso-plate { padding: 48px 8px 96px; }
  .ff .iso-plate-corner[data-corner="readout"] { bottom: 52px; right: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .ff-controls { left: 14px; bottom: 14px; gap: 8px; max-width: calc(100% - 28px); flex-wrap: wrap; }
  .ff-hint { font-size: 9.5px; letter-spacing: 0.06em; line-height: 1.3; }
}
@media (prefers-reduced-motion: reduce) { .ff * { transition: none !important; } }

const TAU = Math.PI * 2;
const LIGHT_UP = 1.2;
const BANDS = [0, 0.2, 0.42, 0.62];

const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul3 = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const len3 = (a) => Math.hypot(a[0], a[1], a[2]);
const unit3 = (a) => {
  const length = len3(a) || 1;
  return [a[0] / length, a[1] / length, a[2] / length];
};
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

function viewOf(P) {
  const { sinA, cosA, sinE, cosE } = cameraOf(P);
  return [cosA * cosE, sinA * cosE, sinE];
}

function lightOf(P) {
  const { sinA, cosA } = cameraOf(P);
  return unit3([-sinA, cosA, LIGHT_UP]);
}

const scaleOf = (P) => cameraOf(P).k;

function bandOf(score) {
  let tone = 0;
  while (tone < BANDS.length && score >= BANDS[tone]) tone++;

}

const toneOf = (normal, P) => bandOf(dot3(unit3(normal), lightOf(P)));

function frameAlong(o, a) {

  const u = unit3(cross3(helper, axis));
  const v = cross3(axis, u);

const frameOf = (o, a, u, v) => ({ o, a, u, v });

function pointOf(F, s, r, angle) {
  const c = Math.cos(angle);
  const n = Math.sin(angle);
  return [
    F.o[0] + F.a[0] * s + r * (c * F.u[0] + n * F.v[0]),
    F.o[1] + F.a[1] * s + r * (c * F.u[1] + n * F.v[1]),
    F.o[2] + F.a[2] * s + r * (c * F.u[2] + n * F.v[2]),

}

const radialOf = (F, angle) => {
  const c = Math.cos(angle);
  const n = Math.sin(angle);
  return [c * F.u[0] + n * F.v[0], c * F.u[1] + n * F.v[1], c * F.u[2] + n * F.v[2]];
};

const tangentOf = (F, angle) => {
  const c = Math.cos(angle);
  const n = Math.sin(angle);
  return [-n * F.u[0] + c * F.v[0], -n * F.u[1] + c * F.v[1], -n * F.u[2] + c * F.v[2]];

const angleToward = (F, direction) => Math.atan2(dot3(direction, F.v), dot3(direction, F.u));

function hullTagged(points) {

    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 1e-9) lower.pop();
    lower.push(point);
  }

    const point = sorted[index];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 1e-9) upper.pop();

function lathe_runsOf(flags) {
  const count = flags.length;
  const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);

  let run = null;
  for (let step = 0; step < count; step++) {
    const index = (start + step) % count;
    if (flags[index]) {
      if (!run) run = [index];
      run.push((index + 1) % count);
    } else if (run) {
      runs.push(run);
      run = null;
    }
  }
  if (run) runs.push(run);
  return runs;
}

function groupsOf(keys) {
  const count = keys.length;

  const start = keys.findIndex((key, index) => key !== keys[(index + count - 1) % count]);
  if (start < 0) {
    if (keys[0] !== null) out.push({ key: keys[0], run: Array.from({ length: count + 1 }, (_, index) => index % count) });
    return out;
  }
  let current = null;
  for (let step = 0; step < count; step++) {
    const index = (start + step) % count;
    const key = keys[index];
    if (current && current.key === key) {
      current.run.push((index + 1) % count);
      continue;
    }
    if (current && current.key !== null) out.push(current);
    current = { key, run: [index, (index + 1) % count] };
  }
  if (current && current.key !== null) out.push(current);
  return out;
}

const stepsFor = (radius, least = 16, most = 112, scale = 0) => Math.max(least, Math.min(most, scale ? Math.ceil((TAU * radius * scale) / 3) : Math.round((radius * 1.3) / 4) * 4));

function chains(edges) {

  for (const [a, b, keep] of edges) {
    if (!keep) {
      if (current) out.push(current);
      current = null;
      continue;
    }
    if (!current) current = [a];
    current.push(b);

  if (current) out.push(current);

function labelledArcs(nr, na, view, light, gr = nr, ga = na) {
  const cuts = [];
  if (Math.abs(gr) > 1e-9) {
    const visibleCut = -(ga * view.a) / (gr * view.flat);
    if (visibleCut > -1 && visibleCut < 1) {
      const d = Math.acos(visibleCut);
      cuts.push(view.phi - d, view.phi + d);
    }

  if (Math.abs(nr) > 1e-9) {
    for (const threshold of BANDS) {
      const c = (threshold - na * light.a) / (nr * light.flat);
      if (c > -1 && c < 1) {
        const d = Math.acos(c);
        cuts.push(light.phi - d, light.phi + d);
      }

  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const sorted = [...new Set(cuts.map((angle) => Math.round(wrap(angle) * 1e9) / 1e9))].sort((a, b) => a - b);

function hermiteSlopes(run) {
  const n = run.length - 1;
  const h = Array.from({ length: n }, (_, j) => run[j + 1][0] - run[j][0]);
  const delta = h.map((value, j) => (run[j + 1][1] - run[j][1]) / value);
  const d = new Array(n + 1).fill(0);
  const end = (h0, h1, d0, d1) => {
    let value = ((2 * h0 + h1) * d0 - h0 * d1) / (h0 + h1);
    if (Math.sign(value) !== Math.sign(d0)) value = 0;
    else if (Math.sign(d0) !== Math.sign(d1) && Math.abs(value) > Math.abs(3 * d0)) value = 3 * d0;
    return value;
  };
  if (n === 1) d[0] = d[1] = delta[0];
  else {
    d[0] = end(h[0], h[1], delta[0], delta[1]);
    d[n] = end(h[n - 1], h[n - 2], delta[n - 1], delta[n - 2]);
  }
  for (let k = 1; k < n; k++) {
    if (delta[k - 1] * delta[k] <= 0) continue;
    const w1 = 2 * h[k] + h[k - 1];
    const w2 = h[k] + 2 * h[k - 1];
    d[k] = (w1 + w2) / (w1 / delta[k - 1] + w2 / delta[k]);
  }
  return d;
}

function curveRuns(meridian) {
  const m = meridian.length;
  const segments = new Array(m - 1).fill(null);
  let start = 0;
  while (start < m - 1) {
    let end = start + 1;
    while (end < m - 1 && meridian[end][2] && Math.abs(meridian[end + 1][0] - meridian[end][0]) > 1e-9 && Math.abs(meridian[end][0] - meridian[end - 1][0]) > 1e-9) end++;

    const n = run.length - 1;
    if (n >= 2 && run.every((point, j) => j === 0 || Math.abs(point[0] - run[j - 1][0]) > 1e-9)) {
      const d = hermiteSlopes(run);
      for (let j = 0; j < n; j++) {

        const [s1, r1] = run[j + 1];
        const hj = s1 - s0;
        const d0 = d[j];
        const d1 = d[j + 1];

        segments[start + j] = { radius, slope };

    start = end;
  }
  return segments;

    const [s1] = meridian[i + 1];

  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(lathe_oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const lathe_signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const lathe_oriented = (points) => (lathe_signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(lathe_oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(lathe_oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = lathe_runsOf(seen);
  const back = lathe_runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = lathe_oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const flat = Math.hypot(uV, vV);
  const phi = Math.atan2(vV, uV);
  const norm = Math.hypot(1, slope);
  const full = Math.abs(to - from - TAU) < 1e-9;
  let visible;
  if (flat < 1e-9) visible = (inward ? slope * aV / norm > least : -slope * aV / norm > least) ? [[phi, phi + TAU]] : [];
  else if (inward) {
    const c = (slope * aV - least * norm) / flat;
    visible = c <= -1 ? [] : c >= 1 ? [[phi, phi + TAU]] : [[phi + Math.acos(c), phi + TAU - Math.acos(c)]];
  } else {
    const c = (least * norm + slope * aV) / flat;
    visible = c >= 1 ? [] : c <= -1 ? [[phi, phi + TAU]] : [[phi - Math.acos(c), phi + Math.acos(c)]];
  }
  const at = (t) => iso(pointOf(F, s, r, t), P);
  const speed = (t) => {
    const a = at(t - 1e-3);
    const b = at(t + 1e-3);
    return Math.hypot(b[0] - a[0], b[1] - a[1]) / 2e-3;
  };
  const count = (span) => Math.max(2, Math.ceil(((steps || stepsFor(r, 24, 112)) * span) / TAU), Math.ceil((span * r * scaleOf(P)) / 1.5));
  const out = [];
  for (const [a, b] of visible) {
    if (b - a >= TAU - 1e-9 && full) {
      const n = count(TAU);
      out.push(pathOf(Array.from({ length: n }, (_, j) => at(from + (j / n) * TAU)), true));
      continue;
    }
    const pieces = full ? [[a, b, true, true]] : [];
    if (!full)
      for (let turn = -2; turn <= 2; turn++) {
        const lo = Math.max(a + turn * TAU, from);
        const hi = Math.min(b + turn * TAU, to);
        if (hi - lo > 1e-6) pieces.push([lo, hi, lo > from + 1e-9, hi < to - 1e-9]);
      }
    for (const [lo, hi, limb0, limb1] of pieces) {
      const span = hi - lo;
      const cut0 = limb0 && trim > 0 ? Math.min(span * 0.25, trim / (speed(lo) || 1)) : 0;
      const cut1 = limb1 && trim > 0 ? Math.min(span * 0.25, trim / (speed(hi) || 1)) : 0;
      const t0 = lo + cut0;
      const t1 = hi - cut1;
      const n = count(t1 - t0);
      out.push(pathOf(Array.from({ length: n + 1 }, (_, j) => at(t0 + ((t1 - t0) * j) / n))));
    }
  }
  return out.join("");
}

function circleOf(F, s, r, P, steps = 0) {
  const count = steps || stepsFor(r, 24, 112);
  return pathOf(
    Array.from({ length: count }, (_, j) => iso(pointOf(F, s, r, (j / count) * TAU), P)),
    true,
  );
}

function spokesOf(F, s, r0, r1, count, P, { phase = 0, sweep = 0, from = 0, to = TAU } = {}) {
  const lines = [];
  for (let index = 0; index < count; index++) {
    const t = phase + from + (index / count) * (to - from);
    lines.push(pathOf([iso(pointOf(F, s, r0, t), P), iso(pointOf(F, s, r1, t + sweep), P)]));
  }
  return lines.join("");
}

const fadeOf = (value, [lo, hi]) => {
  const t = Math.max(0, Math.min(1, (value - lo) / (hi - lo || 1e-9)));
  return t * t * (3 - 2 * t);
};

function ribsOf(F, s0, s1, r, count, P, { phase = 0, twist = 0, least = 0.12, r1 = r, fade = null, seams = false } = {}) {
  const V = viewOf(P);
  const lines = [];
  const slope = (r1 - r) / (s1 - s0 || 1);
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    const radial = radialOf(F, t + twist / 2);
    const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
    const facing = dot3(normal, V);
    const d = pathOf([iso(pointOf(F, s0, r, t), P), iso(pointOf(F, s1, r1, t + twist), P)]);
    if (fade) {
      const alpha = fadeOf(facing, fade);
      if (alpha > 0.02) lines.push({ d, alpha });
      continue;
    }
    if (facing < least) continue;
    lines.push(d);
  }
  const ends = seams ? [seams === "last" ? "" : arcOf(F, s0, r, P, { slope }), seams === "first" ? "" : arcOf(F, s1, r1, P, { slope })].filter(Boolean) : [];
  if (fade) return [...lines, ...ends.map((d) => ({ d, alpha: 1 }))];
  return [...lines, ...ends].join("");
}

function rodOut(F, from, to, r, P, { stroke = 0, ...options } = {}) {
  const pad = 0.35 / scaleOf(P);
  const ring = (s) => Array.from({ length: 48 }, (_, index) => iso(pointOf(F, s, r + pad, (index / 48) * TAU), P));
  return {
    paths: disc(from - stroke, to, r, F, P, options),
    clip: pathOf(hullOf([...ring(from), ...ring(to + stroke)]), true),
    from,
    to,
    stroke,
    reach: to + stroke,
  };
}

function dotsOf(F, s, r, count, P, { phase = 0, slope = 0, least = 0.08, all = false, fade = null } = {}) {
  const V = viewOf(P);
  const out = [];
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    let alpha = 1;
    if (!all) {
      const radial = radialOf(F, t);
      const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
      const facing = dot3(normal, V);
      if (fade) alpha = fadeOf(facing, fade);
      else if (facing < least) continue;
      if (alpha <= 0.02) continue;
    }
    const [x, y] = iso(pointOf(F, s, r, t), P);
    out.push(alpha < 1 ? [x, y, alpha] : [x, y]);
  }
  return out;
}

function facingOf(F, angle, P, slope = 0) {
  const radial = radialOf(F, angle);
  return dot3(unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]), viewOf(P));
}

function fillet(points, radius, perArc = 7, { P = null, tube = 0, margin = 1.3 } = {}) {
  if (points.length < 3) return points.map((p) => [...p]);
  const V = P && tube ? viewOf(P) : null;
  const out = [[...points[0]]];
  for (let index = 1; index < points.length - 1; index++) {
    const prev = points[index - 1];
    const here = points[index];
    const next = points[index + 1];
    const into = unit3(sub3(here, prev));
    const outOf = unit3(sub3(next, here));
    const cosTurn = Math.max(-1, Math.min(1, dot3(into, outOf)));
    const turn = Math.acos(cosTurn);
    if (turn < 1e-3) {
      out.push([...here]);
      continue;
    }
    const room = Math.min(len3(sub3(here, prev)), len3(sub3(next, here))) * 0.48;
    const facing = V ? Math.abs(dot3(unit3(cross3(into, outOf)), V)) : 1;
    const bend = V ? Math.max(radius, (margin * tube) / (0.7 * Math.max(0.05, facing) ** 2)) : radius;
    const cut = Math.min(bend * Math.tan(turn / 2), room);
    const a = sub3(here, mul3(into, cut));
    const b = add3(here, mul3(outOf, cut));
    const count = Math.max(2, Math.ceil((perArc * turn) / (Math.PI / 2)));
    for (let step = 0; step <= count; step++) {
      const t = step / count;
      const p0 = lerp3(a, here, t);
      const p1 = lerp3(here, b, t);
      out.push(lerp3(p0, p1, t));
    }
  }
  out.push([...points[points.length - 1]]);
  return out;
}

function resample(points, spacing) {
  const lengths = [0];
  for (let index = 1; index < points.length; index++) lengths.push(lengths[index - 1] + len3(sub3(points[index], points[index - 1])));
  const total = lengths[lengths.length - 1];
  const count = Math.max(1, Math.round(total / spacing));
  const out = [];
  let segment = 1;
  for (let step = 0; step <= count; step++) {
    const at = (total * step) / count;
    while (segment < points.length - 1 && lengths[segment] < at) segment++;
    const a = points[segment - 1];
    const b = points[segment];
    const span = lengths[segment] - lengths[segment - 1] || 1;
    out.push(lerp3(a, b, Math.min(1, Math.max(0, (at - lengths[segment - 1]) / span))));
  }
  return out;
}

function pathLength(points) {
  let total = 0;
  for (let index = 1; index < points.length; index++) total += len3(sub3(points[index], points[index - 1]));
  return total;
}

function cut(points, from, to) {
  const out = [];
  let walked = 0;
  for (let index = 1; index < points.length; index++) {
    const a = points[index - 1];
    const b = points[index];
    const length = len3(sub3(b, a));
    const start = walked;
    const end = walked + length;
    if (end >= from && start <= to) {
      const t0 = Math.max(0, (from - start) / (length || 1));
      const t1 = Math.min(1, (to - start) / (length || 1));
      if (!out.length) out.push(lerp3(a, b, t0));
      out.push(lerp3(a, b, t1));
    }
    walked = end;
  }
  return out;
}

const pointAlong = (points, at) => {
  const piece = cut(points, at, at + 0.01);
  return piece[0] ?? points[points.length - 1];
};

function tangentAlong(points, at) {
  const total = pathLength(points);
  const a = pointAlong(points, Math.max(0, at - 0.6));
  const b = pointAlong(points, Math.min(total, at + 0.6));
  return unit3(sub3(b, a));
}

function spiral(F, s, r0, r1, a0, a1, steps = 28) {
  const out = [];
  for (let index = 0; index <= steps; index++) {
    const t = index / steps;
    out.push(pointOf(F, s, r0 + (r1 - r0) * t, a0 + (a1 - a0) * t));
  }
  return out;
}

function arcPoints(F, s, r, a0, a1, steps = 24) {
  return Array.from({ length: steps + 1 }, (_, index) => pointOf(F, s, r, a0 + ((a1 - a0) * index) / steps));
}

const GLSL_ISO = `precision highp float;

vec3 towardViewer(){return vec3(uCam.y*uCam.w,uCam.x*uCam.w,uCam.z);}
vec3 rayOf(vec2 vb){vec2 q=(vb-uOrigin)/uK;return vec3(q.x*uCam.x,-q.x*uCam.y,-q.y/uCam.w);}

float hash12(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}

float window(float x,float a,float b,float soft){return smoothstep(a-soft,a+soft,x)*(1.-smoothstep(b-soft,b+soft,x));}
vec3 tonemap(vec3 c,float exposure){return 1.-exp(-c*exposure);}
`;

const GLSL_TURN = `uniform vec3 uGroupX;
uniform vec3 uGroupY;
uniform vec3 uGroupZ;
uniform vec3 uGroupT;

vec3 toWorld(vec3 g){return uGroupT+g.x*uGroupX+g.y*uGroupY+g.z*uGroupZ;}
vec3 dirToGroup(vec3 d){return vec3(dot(d,uGroupX),dot(d,uGroupY),dot(d,uGroupZ));}
vec3 dirToWorld(vec3 d){return d.x*uGroupX+d.y*uGroupY+d.z*uGroupZ;}

function glslPose(name, prefix = `u${name}`) {
  return `uniform vec3 ${prefix}X;uniform vec3 ${prefix}Y;uniform vec3 ${prefix}Z;uniform vec3 ${prefix}T;
vec3 to${name}(vec3 p){vec3 q=p-${prefix}T;return vec3(dot(q,${prefix}X),dot(q,${prefix}Y),dot(q,${prefix}Z));}

vec3 dirTo${name}(vec3 d){return vec3(dot(d,${prefix}X),dot(d,${prefix}Y),dot(d,${prefix}Z));}
vec3 dirFrom${name}(vec3 d){return d.x*${prefix}X+d.y*${prefix}Y+d.z*${prefix}Z;}

function glCamera(projection) {
  const a = ((projection.azimuth ?? 45) * Math.PI) / 180;
  const e = ((projection.elevation ?? 30) * Math.PI) / 180;
  return {
    origin: [projection.origin[0], projection.origin[1]],
    k: projection.scale * Math.sqrt(1.6),
    cam: [Math.sin(a), Math.cos(a), Math.sin(e), Math.cos(e)],
  };
}

const VERTEX = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";

function glLayer({ canvas, fragment, view, camera, uniforms = [], fixed = {}, extensions = [], maxRatio = 1.5, onError = (message) => console.error(message) }) {

  if (!gl) return null;
  const compile = (type, source) => {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
    onError(gl.getShaderInfoLog(shader));
    return null;

  if (!vs || !fs) return null;
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    onError(gl.getProgramInfoLog(program));
    return null;
  }
  gl.useProgram(program);
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, "p");
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
  const where = {};
  for (const name of ["uCanvas", "uView", "uOrigin", "uK", "uCam", "uTime", ...uniforms, ...Object.keys(fixed)]) where[name] = gl.getUniformLocation(program, name);
  const types = {};
  const active = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let index = 0; index < active; index++) {
    const info = gl.getActiveUniform(program, index);

    const box = canvas.getBoundingClientRect();
    const ratio = Math.min(maxRatio, window.devicePixelRatio || 1);
    const width = Math.max(1, Math.round(box.width * ratio));
    const height = Math.max(1, Math.round(box.height * ratio));

      for (const [name, value] of Object.entries(values)) set(name, value);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      painted = true;
    },
    clear() {
      if (!painted) return;
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      painted = false;
    },
  };
}

const smooth = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

const burst = (age, rise, fall) => (age > 0 ? smooth(0, rise, age) * Math.exp(-Math.max(0, age - rise) / fall) : 0);

function settle(state, target, dt, seconds, calm = false) {
  if (calm) {
    state.x = target;
    state.v = 0;
    return false;
  }
  const w = 1 / seconds;
  for (let index = 0; index < 4; index++) {
    const h = dt / 4;
    state.v += (w * w * (target - state.x) - 2 * w * state.v) * h;
    state.x += state.v * h;
  }
  if (Math.abs(target - state.x) < 1e-4 && Math.abs(state.v) < 1e-4) {
    state.x = target;
    state.v = 0;
    return false;
  }
  return true;
}

// Lockheed Martin F-22A Raptor: public figures and a simplified control blend.
// The fly-by-wire system mixes stick, rudder and throttle into surface deflections;
// the gains here are illustrative, the limits are the published ones.
// Units: metres, kN, degrees.

const F22 = {
  length: 18.9,
  span: 13.56,
  height: 5.08,
  wingArea: 78.0,
  emptyKg: 19700,
  maxKg: 38000,
  engines: 2, // Pratt & Whitney F119-PW-100
  thrustIdleKn: 12,
  thrustMilKn: 116,
  thrustAbKn: 156,
  nozzleVectorDeg: 20, // pitch, each way
  stabilatorDeg: 30,
  rudderDeg: 30,
  flaperonDeg: 20,
  aileronDeg: 25,
  finCantDeg: 28,
  supercruiseMach: 1.8,
  maxMach: 2.25,
  fanIdleShare: 0.35,
};

const THROTTLE = ["idle", "military", "afterburner"];
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

// stick.pitch: -1 nose down .. +1 nose up; stick.roll: -1 left .. +1 right; rudder: -1 left .. +1 right.
// Deflections in degrees, trailing edge down positive for surfaces, exhaust up positive for nozzles.
function surfacesAt(stick, rudder, throttle) {
  const p = clamp(stick.pitch, -1, 1);
  const r = clamp(stick.roll, -1, 1);
  const y = clamp(rudder, -1, 1);
  const stabPitch = -F22.stabilatorDeg * 0.8 * p; // nose up: trailing edge up
  const stabRoll = F22.stabilatorDeg * 0.5 * r; // right roll: right stab trailing edge up
  const stab = { left: clamp(stabPitch - stabRoll, -F22.stabilatorDeg, F22.stabilatorDeg), right: clamp(stabPitch + stabRoll, -F22.stabilatorDeg, F22.stabilatorDeg) };
  const nozzle = F22.nozzleVectorDeg * p;
  const flapPitch = 6 * p;
  const flap = { left: clamp(flapPitch - F22.flaperonDeg * 0.7 * r, -F22.flaperonDeg, F22.flaperonDeg), right: clamp(flapPitch + F22.flaperonDeg * 0.7 * r, -F22.flaperonDeg, F22.flaperonDeg) };
  const aileron = { left: clamp(-F22.aileronDeg * r, -F22.aileronDeg, F22.aileronDeg), right: clamp(F22.aileronDeg * r, -F22.aileronDeg, F22.aileronDeg) };
  const rud = F22.rudderDeg * y;
  const level = THROTTLE.indexOf(throttle);
  const perEngine = level === 2 ? F22.thrustAbKn : level === 1 ? F22.thrustMilKn : F22.thrustIdleKn;
  const fanShare = level === 0 ? F22.fanIdleShare : 1;
  return { pitch: p, roll: r, yaw: y, stab, nozzle, flap, aileron, rudder: rud, throttle, perEngine, totalKn: perEngine * F22.engines, fanShare, afterburner: level === 2 ? 1 : 0, core: level === 0 ? 0.25 : 1 };
}

// Moving surfaces of the F-22, shared by the build and the page. Units: 0.1 m.
const RAD = Math.PI / 180;
const GEO = {
  azimuth: 50,
  elevation: 30,
  cz: 36, // fuselage centreline height
  nacelleY: 13,
  nacelleR: 11,
  deck: { z0: 46.16, z1: 48.2, y: 23.16 },
  boom: { x0: 56, x1: 96, y0: 23.16, y1: 27, z0: 33, z1: 45 },
  nozzle: { hinge: 84, length: 12, halfWidth: 6, halfGap: 6, converge: 8, thick: 0.9 },
  stab: { hingeX: 76, z: 39, polygon: [[27, -16], [46, -4], [46, 3], [27, 9]], thick: 2.2 },
  fin: { rootX: 58, rootY: 25.64, rootTop: 46.2, chordRoot: 32, height: 25, tipFrom: 16, tipTo: 26, rudderChord: 6, thick: 1.6, gap: 0.6 },
  wing: { z: 31.8, thick: 2.4, le: [[-38, 23.16], [25, 68]], te: [[40, 68], [55, 23.16]], flapChord: 8, flaperon: [26, 46], aileron: [48, 66] },
  rotors: [
    { x: -5, width: 3.6, r: 7.4, blades: 14, speed: 1 },
    { x: 7.4, width: 1.6, r: 6.2, blades: 22, speed: 1.6 },
    { x: 10.4, width: 1.6, r: 6.0, blades: 22, speed: 1.6 },
    { x: 13.4, width: 1.6, r: 5.8, blades: 22, speed: 1.6 },
    { x: 16.4, width: 1.6, r: 5.6, blades: 22, speed: 1.6 },
  ],
  windows: {
    fan: { x0: -6.6, x1: 2.6, deg0: -12, deg1: 86, r: 8.1627, bore: 7.6 },
    comp: { x0: 5.6, x1: 18, deg0: -12, deg1: 86, r: 7.0, bore: 6.4 },

  rest: { pitch: 0.35, roll: 0.25, rudder: 0, throttle: "afterburner" },

function partsOf(K, G, M) {
  const UP = [0, 0, 1];
  const X = [1, 0, 0];
  const Y = [0, 1, 0];
  const rot = (v, axis, deg) => {
    // Rodrigues rotation of v about unit axis by deg
    const a = deg * RAD;
    const c = Math.cos(a);
    const s = Math.sin(a);
    const k = G.unit3(axis);
    return G.add3(G.add3(G.mul3(v, c), G.mul3(G.cross3(k, v), s)), G.mul3(k, G.dot3(k, v) * (1 - c)));
  };
  // A thin plate: origin on its hinge axis, u along the axis, v across the plate (aft/outward),
  // normal n = u x v; the polygon is in (u, v). Rotating about the hinge by `deg` turns v and n.
  function plate(origin, hingeDir, acrossDir, polygon, thick, deg, meta) {
    const u = G.unit3(hingeDir);
    const v = G.unit3(rot(acrossDir, u, deg));
    const n = G.unit3(G.cross3(u, v));
    const F = G.frameOf(origin, n, u, v);
    return { kind: "prism", F, polygon, s0: -thick / 2, s1: thick / 2, ...meta };
  }
  // The hinge knuckle: a cylinder along the axis that touches the fixed face and the plate.
  const knuckle = (origin, hingeDir, u0, u1, r, meta) => ({ kind: "disc", F: G.frameAlong(origin, hingeDir), s0: u0, s1: u1, r, tone: "mid", ...meta });

  function stabilators(s) {
    const S = GEO.stab;
    const out = [];
    for (const side of [1, -1]) {
      const deg = side > 0 ? s.stab.right : s.stab.left;
      const polygon = S.polygon.map(([y, x]) => [side * y, x]);
      // trailing edge down positive: the aft direction tips down by deg about the y axis
      const aft = [Math.cos(deg * RAD), 0, -Math.sin(deg * RAD)];
      out.push(plate([S.hingeX, 0, S.z], Y, aft, polygon, S.thick, 0, { tone: "hi", name: `stab.${side > 0 ? "right" : "left"}`, owner: "stab", lines: stabLines(side, deg) }));
    }
    return out;
  }
  function stabLines(side, deg) {
    const S = GEO.stab;
    const aft = [Math.cos(deg * RAD), 0, -Math.sin(deg * RAD)];
    const n = G.unit3(G.cross3(Y, aft));
    const at = (y, v) => G.add3(G.add3([S.hingeX, side * y, S.z], G.mul3(aft, v)), G.mul3(n, -(S.thick / 2 + 0.01)));
    const edge = (y) => -16 + ((y - 27) / 19) * 12; // leading edge v at this span
    const trail = (y) => 9 - ((y - 27) / 19) * 6;
    return [[at(33, edge(33)), at(33, trail(33))], [at(40, edge(40)), at(40, trail(40))]];
  }

  // The fin's frame and its hinge line, shared by the fixed fin, the fairing and the rudder.
  function finOf(side) {
    const Fn = GEO.fin;
    const cant = M.F22.finCantDeg * RAD;
    const up = [0, side * Math.sin(cant), Math.cos(cant)];
    const n = G.unit3(G.cross3(X, up));
    const root = [Fn.rootX, side * Fn.rootY, Fn.rootTop];
    const teRoot = G.add3(root, G.mul3(X, Fn.chordRoot));
    const teTip = G.add3(G.add3(root, G.mul3(X, Fn.tipTo)), G.mul3(up, Fn.height));
    const hingeDir = G.unit3(G.sub3(teTip, teRoot));
    const acrossRaw = G.unit3(G.cross3(n, hingeDir));
    const across = G.dot3(acrossRaw, X) > 0 ? acrossRaw : G.mul3(acrossRaw, -1);
    const a = G.dot3(across, up);
    const h = G.dot3(hingeDir, up);
    const face = G.sub3(teRoot, G.mul3(across, Fn.rudderChord)); // the fin's trailing face
    const axis = G.add3(face, G.mul3(across, Fn.thick / 2)); // the rudder hinge axis
    const faceAt = (upAt) => G.add3(face, G.mul3(hingeDir, (upAt + Fn.rudderChord * a) / h));
    return { up, n, root, hingeDir, across, a, h, face, axis, faceAt, F: G.frameOf(root, n, X, up) };
  }
  function finPolygon(side) {
    const Fn = GEO.fin;
    const f = finOf(side);
    const pR = f.faceAt(0);
    const pT = f.faceAt(Fn.height);
    return { F: f.F, polygon: [[0, 0], [G.dot3(G.sub3(pR, f.root), X), 0], [G.dot3(G.sub3(pT, f.root), X), Fn.height], [Fn.tipFrom, Fn.height]] };
  }
  // The root fairing on the boom: a prism along x whose top mates the canted fin's bottom face.
  function finFairing(side) {
    const Fn = GEO.fin;
    const B = GEO.boom;
    const f = finOf(side);
    const c1 = G.add3(f.root, G.mul3(f.n, Fn.thick / 2));
    const c2 = G.sub3(f.root, G.mul3(f.n, Fn.thick / 2));
    const low = c1[2] < c2[2] ? c1 : c2;
    const high = c1[2] < c2[2] ? c2 : c1;
    const inboard = side * (B.y0 + 0.45);
    const outboard = side * B.y1;
    const polygon = [[inboard, B.z1], [outboard, B.z1], [low[1], low[2]], [high[1], high[2]], [side * (Math.abs(high[1]) - 1.0), high[2]]];
    return { polygon: side > 0 ? polygon : polygon.slice().reverse() };
  }
  function rudders(s) {
    const Fn = GEO.fin;
    const out = [];
    for (const side of [1, -1]) {
      const f = finOf(side);
      const t = Fn.thick / 2;
      const inner = Fn.rudderChord - t; // the trailing edge, measured from the axis
      const uOf = (upAt, v) => (upAt + (Fn.rudderChord - t) * f.a - v * f.a) / f.h;
      const uA = uOf(Fn.gap, t);
      const uD = uOf(Fn.height - Fn.gap, t);
      const polygon = [[uA, t], [uOf(Fn.gap, inner), inner], [uOf(Fn.height - Fn.gap, inner), inner], [uD, t]];
      const name = side > 0 ? "right" : "left";
      out.push(knuckle(f.axis, f.hingeDir, uA, uD, t, { name: `rudder.knuckle-${name}`, owner: "rudder" }));
      out.push(plate(f.axis, f.hingeDir, f.across, polygon, Fn.thick, -side * s.rudder, { tone: "hi", name: `rudder.${name}`, owner: "rudder" }));
    }
    return out;
  }

  // Trailing-edge surfaces on each wing, hinged on knuckles along the shifted trailing edge.
  function wingFlaps(s) {
    const Wg = GEO.wing;
    const out = [];
    const t = Wg.thick / 2;
    for (const side of [1, -1]) {
      const te0 = [Wg.te[1][0], side * Wg.te[1][1]]; // root
      const te1 = [Wg.te[0][0], side * Wg.te[0][1]]; // tip
      const dir = G.unit3([te1[0] - te0[0], te1[1] - te0[1], 0]);
      const fwd = G.unit3(G.cross3(dir, UP));
      const inward = G.dot3(fwd, X) < 0 ? fwd : G.mul3(fwd, -1);
      const aft = G.mul3(inward, -1);
      const span = G.len3([te1[0] - te0[0], te1[1] - te0[1], 0]);
      for (const [name, range, deg] of [["flaperon", Wg.flaperon, side > 0 ? s.flap.right : s.flap.left], ["aileron", Wg.aileron, side > 0 ? s.aileron.right : s.aileron.left]]) {
        const t0 = (range[0] - Wg.te[1][1]) / (Wg.te[0][1] - Wg.te[1][1]);
        const t1 = (range[1] - Wg.te[1][1]) / (Wg.te[0][1] - Wg.te[1][1]);
        // the wing's trailing face is flapChord inward of the planform edge; the axis sits t behind it
        const axis = G.add3([te0[0], te0[1], Wg.z + t], G.add3(G.mul3(dir, t0 * span), G.mul3(inward, Wg.flapChord - t)));
        const length = (t1 - t0) * span;
        const polygon = [[0, t], [length, t], [length, Wg.flapChord - t], [0, Wg.flapChord - t]];
        const hinge = side > 0 ? dir : G.mul3(dir, -1);
        const rootAt = side > 0 ? axis : G.add3(axis, G.mul3(dir, length));
        const id = `${name}-${side > 0 ? "right" : "left"}`;
        out.push(knuckle(rootAt, hinge, 0, length, t, { name: `wing.knuckle-${id}`, owner: "wing" }));
        out.push(plate(rootAt, hinge, aft, polygon, Wg.thick, side > 0 ? deg : -deg, { tone: "hi", name: `wing.${id}`, owner: "wing" }));
      }
    }
    return out;
  }

  // Nozzle flaps: upper and lower on each engine, converging, vectored together.
  function nozzleFlaps(s) {
    const N = GEO.nozzle;
    const t = N.thick / 2;
    const out = [];
    for (const side of [1, -1]) {
      const cy = side * GEO.nacelleY;
      for (const [name, which] of [["upper", 1], ["lower", -1]]) {
        const tilt = which > 0 ? N.converge - s.nozzle : -N.converge - s.nozzle; // degrees below +x
        const axis = [N.hinge + t, cy, GEO.cz + which * N.halfGap];
        const aft = [Math.cos(tilt * RAD), 0, -Math.sin(tilt * RAD)];
        const id = `${name}-${side > 0 ? "right" : "left"}`;
        const mid = G.add3(axis, G.mul3(aft, N.length * 0.55));
        out.push(knuckle(axis, Y, -N.halfWidth, N.halfWidth, t, { name: `nozzle.knuckle-${id}`, owner: "nozzle" }));
        out.push(plate(axis, Y, aft, [[-N.halfWidth, t], [N.halfWidth, t], [N.halfWidth, N.length], [-N.halfWidth, N.length]], N.thick, 0, { tone: "hi", name: `nozzle.${id}`, owner: "nozzle", faceLines: [[G.add3(mid, [0, -N.halfWidth, 0]), G.add3(mid, [0, N.halfWidth, 0])]], lineTone: "faint" }));
      }
    }
    return out;
  }
  // Exit centre and direction of each plume.
  function plumeOf(s, side) {
    const N = GEO.nozzle;
    const v = s.nozzle * RAD;
    const dir = [Math.cos(v), 0, Math.sin(v)];
    const exit = G.add3([N.hinge, side * GEO.nacelleY, GEO.cz], G.mul3(dir, N.length));
    return { exit, dir };
  }

  // A rounded window on a cylinder along x, as screen points; angles from +y toward +z.
  function windowPoints(cy, cz, r, x0, x1, deg0, deg1, P) {
    const corner = 2.2;
    const arc0 = r * deg0 * RAD;
    const arc1 = r * deg1 * RAD;
    const pts = [];
    const cornerPts = (ca, cz2, start) => {
      for (let i = 0; i <= 6; i++) {
        const a = start + (i / 6) * (Math.PI / 2);
        pts.push([ca + corner * Math.cos(a), cz2 + corner * Math.sin(a)]);
      }
    };
    cornerPts(x1 - corner, arc1 - corner, 0);
    cornerPts(x0 + corner, arc1 - corner, Math.PI / 2);
    cornerPts(x0 + corner, arc0 + corner, Math.PI);
    cornerPts(x1 - corner, arc0 + corner, 1.5 * Math.PI);
    return pts.map(([x, arc]) => K.iso([x, cy + r * Math.cos(arc / r), cz + r * Math.sin(arc / r)], P));
  }
  // Clip the screen segment a-b to a convex screen polygon (Cyrus-Beck). Returns null when outside.
  function clipToPolygon(a, b, poly) {
    let t0 = 0;
    let t1 = 1;
    const d = [b[0] - a[0], b[1] - a[1]];
    const n = poly.length;
    let area = 0;
    for (let i = 0; i < n; i++) area += poly[i][0] * poly[(i + 1) % n][1] - poly[(i + 1) % n][0] * poly[i][1];
    const sign = area > 0 ? 1 : -1;
    for (let i = 0; i < n; i++) {
      const p = poly[i];
      const q = poly[(i + 1) % n];
      const e = [q[0] - p[0], q[1] - p[1]];
      const nrm = [sign * e[1], -sign * e[0]]; // outward normal
      const num = nrm[0] * (a[0] - p[0]) + nrm[1] * (a[1] - p[1]);
      const den = nrm[0] * d[0] + nrm[1] * d[1];
      if (Math.abs(den) < 1e-9) {
        if (num > 0) return null;
        continue;
      }
      const t = -num / den;
      if (den < 0) t0 = Math.max(t0, t);
      else t1 = Math.min(t1, t);
      if (t0 > t1) return null;
    }
    return [[a[0] + d[0] * t0, a[1] + d[1] * t0], [a[0] + d[0] * t1, a[1] + d[1] * t1]];
  }
  // Blade tips on the rims of the rotor discs, seen edge-on through a window, as clipped lines.
  function rotorBlades(rows, phaseDeg, window, P) {
    const V = G.viewOf(P);
    const F = G.frameOf([0, GEO.nacelleY, GEO.cz], X, Y, UP);
    const out = [];
    for (const row of rows) {
      for (let i = 0; i < row.blades; i++) {
        const a = (phaseDeg * row.speed + (i * 360) / row.blades) * RAD;
        const normal = [0, Math.cos(a), Math.sin(a)];
        const facing = G.dot3(normal, V);
        if (facing < 0.08) continue;
        const p0 = K.iso(G.pointOf(F, row.x - row.width / 2, row.r + 0.02, a), P);
        const p1 = K.iso(G.pointOf(F, row.x + row.width / 2, row.r + 0.02, a), P);
        const seg = clipToPolygon(p0, p1, window);
        if (!seg) continue;
        if (Math.hypot(seg[1][0] - seg[0][0], seg[1][1] - seg[0][1]) < 0.6) continue;
        out.push(K.lineSvg(`M${seg[0][0].toFixed(2)} ${seg[0][1].toFixed(2)}L${seg[1][0].toFixed(2)} ${seg[1][1].toFixed(2)}`, { tone: facing > 0.5 ? "mid" : "faint" }));
      }
    }
    return out.join("");
  }

  function drawDesc(desc, P) {
    if (!desc) return "";
    if (desc.kind === "prism") {
      // faceLines sit on the plate's mid-plane; lift them onto whichever face looks at the camera
      const sign = G.dot3(desc.F.a, G.viewOf(P)) > 0 ? 1 : -1;
      const lift = G.mul3(desc.F.a, sign * (desc.s1 + 0.01));
      const onFace = (desc.faceLines ?? []).map(([a, b]) => [G.add3(a, lift), G.add3(b, lift)]);
      const lines = [...(desc.lines ?? []), ...onFace].map(([a, b]) => K.lineSvg(K.segment(a, b, P), { tone: desc.lineTone ?? "faint" })).join("");
      return K.solidSvg(G.prismOf(desc.F, desc.polygon, desc.s0, desc.s1, P), { tone: desc.tone, lit: desc.lit, className: desc.className }) + lines;
    }
    if (desc.kind === "disc") return K.solidSvg(G.disc(desc.s0, desc.s1, desc.r, desc.F, P), { tone: desc.tone });
    return "";
  }
  return { stabilators, rudders, wingFlaps, nozzleFlaps, plumeOf, finOf, finPolygon, finFairing, windowPoints, clipToPolygon, rotorBlades, drawDesc, rot };
}

const draw = (descs) => descs.map((d) => parts.drawDesc(d, P)).join("");
const WIN = Object.fromEntries(Object.entries(GEO.windows).map(([id, w]) => [id, parts.windowPoints(GEO.nacelleY, GEO.cz, w.r, w.x0, w.x1, w.deg0, w.deg1, P)]));
const [FAN_ROW, ...COMP_ROWS] = GEO.rotors;
function spin(phase) {
  dyn.fan.innerHTML = parts.rotorBlades([FAN_ROW], phase, WIN.fan, P);
  dyn.comp.innerHTML = parts.rotorBlades(COMP_ROWS, phase, WIN.comp, P);
}
function fill(kind, descs) {
  for (const side of ["right", "left"]) dyn[`${kind}-${side}`].innerHTML = draw(descs.filter((d) => d.name.endsWith(side)));
}
function place(s) {
  if (Math.abs(s.pitch - shown.pitch) > 1e-3 || Math.abs(s.roll - shown.roll) > 1e-3) {
    fill("stabs", parts.stabilators(s));
    fill("flaps", parts.wingFlaps(s));
    fill("nozzles", parts.nozzleFlaps(s));
  }
  if (Math.abs(s.yaw - shown.rudder) > 1e-3) fill("rudders", parts.rudders(s));
  shown = { pitch: s.pitch, roll: s.roll, rudder: s.yaw, throttle: s.throttle };
}
function say(text) {
  if (readout.textContent !== text) readout.textContent = text;
}
const fmtDeg = (v) => `${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(0)}°`;
function readoutOf(s) {
  return `stabs ${fmtDeg(s.stab.left)} / ${fmtDeg(s.stab.right)} · nozzles ${fmtDeg(s.nozzle)} · rudders ${fmtDeg(s.rudder)} · ${s.throttle === "afterburner" ? "A/B" : s.throttle === "military" ? "mil" : "idle"} ${s.totalKn.toFixed(0)} kN`;
}
function describe(s) {
  const text = `${s.throttle} power, ${s.totalKn.toFixed(0)} kilonewtons; stabilators ${s.stab.left.toFixed(0)} and ${s.stab.right.toFixed(0)} degrees, nozzles ${s.nozzle.toFixed(0)}, rudders ${s.rudder.toFixed(0)}`;
  if (said === text) return;
  said = text;
  if (liveRegion) liveRegion.textContent = text;
  stage.setAttribute("aria-valuetext", text);
  throttleButtons.forEach((b) => (b.dataset.throttle === s.throttle ? b.setAttribute("data-on", "") : b.removeAttribute("data-on")));
}

// ---------------------------------------------------------------- afterburner plumes
const FRAGMENT = `
uniform vec3 uExit[2];
uniform vec3 uDir;
uniform float uAb;
uniform float uCore;
uniform float uLight;
const vec2 VIEW=vec2(${D.W.toFixed(1)},${D.H.toFixed(1)});
vec4 inkFor(vec3 seen,float cover){vec3 absorbed=1.-seen;float a=max(max(absorbed.r,max(absorbed.g,absorbed.b)),cover);return vec4(vec3(a)-absorbed,a);}
void main(){
  vec2 vb=viewOf(gl_FragCoord.xy);
  vec3 V=towardViewer();
  vec3 g0=rayOf(vb);
  float edge=smoothstep(10.,40.,vb.x)*(1.-smoothstep(VIEW.x-40.,VIEW.x-10.,vb.x))*smoothstep(10.,40.,vb.y)*(1.-smoothstep(VIEW.y-40.,VIEW.y-10.,vb.y));
  float T=uTime;
  vec3 col=vec3(0.);
  float energy=0.;
  float len=mix(20.,60.,uAb)*uCore;
  for(int e=0;e<2;e++){
    vec3 o=uExit[e];
    vec3 d=uDir;
    // distance of this ray from the plume axis, and position along it
    vec3 w=g0-o;
    float dd=dot(d,V);
    float den=1.-dd*dd;
    float sA=(dot(w,d)-dd*dot(w,V))/den;      // along the axis at closest approach
    float tV=(dd*dot(w,d)-dot(w,V))/den;
    vec3 pA=o+d*sA;
    vec3 pV=g0+V*tV;
    float r=length(pA-pV);
    if(sA<-2.||sA>len*1.3)continue;
    float along=smoothstep(-1.5,1.,sA)*(1.-smoothstep(len*.5,len,sA));
    float R=3.4+sA*mix(.03,.085,uAb);
    float rn=r/R;
    if(rn>1.8)continue;
    float n=fbm2(vec2(sA*.12-T*9.,r*.3+float(e)*2.));
    float ragged=1.+(n-.5)*.5*smoothstep(4.,40.,sA);
    float body=exp(-rn*rn*3.*ragged);
    float cells=1.+.12*uAb*cos(sA*.9)*smoothstep(0.,4.,sA)*(1.-smoothstep(20.,50.,sA));
    float core=exp(-rn*rn*9.)*exp(-sA/40.);
    float eSample=(body*(.3+.9*uAb)*cells+core*(.5+.9*uAb))*along*(.35+.65*uCore);
    vec3 hot=mix(vec3(.55,.62,1.),vec3(1.,.55,.18),uAb*smoothstep(0.,.3,uAb));
    vec3 pale=vec3(1.,.9,.72);
    col+=mix(hot,pale,core*.6)*eSample*mix(.35,1.,uAb);
    energy+=eSample*mix(.35,1.,uAb);
  }
  col*=edge;energy*=edge;
  vec3 dark=tonemap(col,1.2);
  float m=max(dark.r,max(dark.g,dark.b));
  float nz=(hash12(gl_FragCoord.xy+fract(uTime*.61)*91.)+hash12(gl_FragCoord.yx*1.37+fract(uTime*.37)*57.)-1.)/255.;
  dark=max(dark+nz*smoothstep(0.,1.5/255.,m),0.);
  m=max(dark.r,max(dark.g,dark.b));
  float en=1.-exp(-1.4*energy);
  vec3 vac=vec3(.80,.85,.98);
  vec3 bodyInk=mix(vec3(1.),mix(vac,vec3(1.,.6,.15),uAb),smoothstep(0.,.45,en));
  bodyInk=mix(bodyInk,mix(vac,vec3(.9,.42,.08),uAb),smoothstep(.45,.85,en));
  bodyInk=mix(bodyInk,vec3(1.,.9,.72),smoothstep(.88,1.,en)*uAb);
  float cover=.2*smoothstep(.7,1.,en)*uAb;
  vec4 light=inkFor(bodyInk,cover)*edge;
  light=max(light+vec4(nz)*smoothstep(0.,1.5/255.,light.a),0.);
  light.rgb=min(light.rgb,vec3(light.a));
  gl_FragColor=mix(vec4(dark,m),light,uLight);
}`;
const layer = glLayer({ canvas, fragment: FRAGMENT, view: [D.W, D.H], camera: D.camera, uniforms: ["uExit", "uDir", "uAb", "uCore"], fixed: { uLight: LIGHT } });
if (layer) stage.setAttribute("data-gl", "");
const exits = new Float32Array(6);
function paint(s, calm) {
  if (!layer) return;
  if (core.x < 0.02) {
    layer.clear();
    return;
  }
  for (const [i, side] of [[0, 1], [1, -1]]) {
    const { exit } = parts.plumeOf(s, side);
    exits[i * 3] = exit[0];
    exits[i * 3 + 1] = exit[1];
    exits[i * 3 + 2] = exit[2];
  }
  const { dir } = parts.plumeOf(s, 1);
  layer.draw({ uExit: exits, uDir: dir, uAb: ab.x, uCore: core.x }, calm ? 0.8 : clock);
}

function tourAt(t) {
  const c = t % 16;
  const pitch = Math.sin((c / 16) * Math.PI * 2) * 0.8;
  const roll = Math.sin((c / 8) * Math.PI * 2 + 1) * 0.6;
  const rud = c > 10 && c < 13 ? Math.sin(((c - 10) / 3) * Math.PI) * 0.8 : 0;
  const thr = c < 5 ? "military" : c < 11 ? "afterburner" : "idle";
  return { pitch, roll, rudder: rud, throttle: thr };
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  const calm = still.matches;
  if (touring) {
    tourClock += dt;
    const step = tourAt(tourClock);
    target.pitch = step.pitch;
    target.roll = step.roll;
    target.rudder = step.rudder;
    if (step.throttle !== throttle) setThrottle(step.throttle, false);
  }
  const ease = calm ? 1 : 1 - Math.exp(-dt / 0.22);
  stick.pitch += (target.pitch - stick.pitch) * ease;
  stick.roll += (target.roll - stick.roll) * ease;
  rudder += (target.rudder - rudder) * ease;
  const s = surfacesAt(stick, rudder, throttle);
  let moving = settle(ab, s.afterburner, dt, 0.35, calm);
  moving = settle(core, s.core, dt, 0.6, calm) || moving;
  fanPhase = (fanPhase + dt * 360 * (0.5 + 1.5 * core.x)) % 360;
  if (!calm) spin(fanPhase);
  place(s);
  paint(s, calm);
  say(readoutOf(s));
  describe(s);
  const settled = Math.abs(target.pitch - stick.pitch) < 1e-3 && Math.abs(target.roll - stick.roll) < 1e-3 && Math.abs(target.rudder - rudder) < 1e-3;
  frame = visible && (!settled || moving || touring || (!calm && core.x > 0.02)) ? requestAnimationFrame(tick) : 0;
}
function run() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}
new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  },
  { rootMargin: "120px 0px" },
).observe(stage);

let held = false;
function takeOver() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (held) return takeOver();
    touring = !still.matches;
    tourClock = 0;
    run();
  }, 8000);
  run();
}
function setThrottle(next, user = true) {
  throttle = next;
  if (user) takeOver();
  run();
}
let drag = null;
const fractionsOf = (event) => {
  const box = stage.getBoundingClientRect();
  return [(event.clientX - box.left) / box.width, (event.clientY - box.top) / box.height];
};
stage.addEventListener("pointerdown", (event) => {
  held = true;
  stage.setPointerCapture(event.pointerId);
  const [fx, fy] = fractionsOf(event);
  drag = { fx, fy, pitch: touring ? stick.pitch : target.pitch, roll: touring ? stick.roll : target.roll };
  takeOver();
});
stage.addEventListener("pointermove", (event) => {
  if (!held || !drag) return;
  const [fx, fy] = fractionsOf(event);
  target.roll = clampTo(drag.roll + (fx - drag.fx) * 3, -1, 1);
  target.pitch = clampTo(drag.pitch + (fy - drag.fy) * 3, -1, 1);
  takeOver();
});
const release = () => {
  held = false;
  drag = null;
};
stage.addEventListener("pointerup", release);
stage.addEventListener("pointercancel", release);
throttleButtons.forEach((b) => b.addEventListener("click", () => setThrottle(b.dataset.throttle)));
const keysDown = new Set();
stage.addEventListener("keydown", (event) => {
  const step = event.shiftKey ? 0.5 : 0.2;
  if (event.key === "ArrowUp") target.pitch = clampTo((touring ? stick.pitch : target.pitch) - step, -1, 1);
  else if (event.key === "ArrowDown") target.pitch = clampTo((touring ? stick.pitch : target.pitch) + step, -1, 1);
  else if (event.key === "ArrowLeft") target.roll = clampTo((touring ? stick.roll : target.roll) - step, -1, 1);
  else if (event.key === "ArrowRight") target.roll = clampTo((touring ? stick.roll : target.roll) + step, -1, 1);
  else if (event.key === "a" || event.key === "A") target.rudder = clampTo(target.rudder - step, -1, 1);
  else if (event.key === "d" || event.key === "D") target.rudder = clampTo(target.rudder + step, -1, 1);
  else if (event.key === "Home") Object.assign(target, { pitch: 0, roll: 0, rudder: 0 });
  else if (event.key === "1") setThrottle("idle");
  else if (event.key === "2") setThrottle("military");
  else if (event.key === "3") setThrottle("afterburner");
  else if (event.key === "Escape") Object.assign(target, { pitch: 0, roll: 0, rudder: 0 });
  else return;
  event.preventDefault();
  takeOver();
});
void keysDown;
if (still.matches) touring = false;
place(surfacesAt(stick, rudder, throttle));
say(readoutOf(surfacesAt(stick, rudder, throttle)));
describe(surfacesAt(stick, rudder, throttle));
</script></body></html>
